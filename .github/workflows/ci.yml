name: CI

# The check list is dev.json, run by scripts/dev/check.sh (the development kit's vendored runner);
# the longer steps are scripts under scripts/checks/ with the comments they had here. Branch
# protection requires `Runner (<os>)`, `Release contents` and `PostgreSQL store` by their names:
# `Unit tests (<os>, i/n)` runs one of the shards of the unit-tests step, four on Linux and three
# on macOS, `Runner (<os>)` runs every other step but the release ones once every shard has ended
# and fails unless every shard succeeded, `Release contents` runs the release steps, and
# `PostgreSQL store` runs the postgresql store kind's tests against a service container. Each sets
# up the exact toolchain release.yml names. On a pull request the `Unit tests` and `Runner` jobs run only the
# steps jpdev.json maps the changed paths to (`check.sh --changed`); on a push to main they run the
# whole list. `Release contents` runs its four steps every time. A push to main also records each
# job's evidence (scripts/dev/release_evidence.py capture), which the release takes at that commit
# instead of running this workflow again (docs/releasing.md, "CI at the tag").

on:
  pull_request:
  # The merge queue's group: the pull request on top of main and of the groups ahead of it, checked
  # before main moves (docs/releasing.md, "Merging").
  merge_group:
  push:
    branches: [main]
  # Kept; the release no longer calls this workflow. A refusal at the tag is answered by re-running
  # main's run at the commit (docs/releasing.md), which keeps the evidence a push-to-main run's.
  workflow_call:

# A new push to a pull request cancels that pull request's run in progress. A push to main and a
# merge group each have a group of their own commit, so no run of main, which a release takes as
# its evidence, is ever cancelled or dropped as a pending duplicate.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The unit-tests step in shards (scripts/checks/unit-tests.sh, JPACK_UNIT_SHARD=i/n, which runs
  # row i of the script's table of n rows), each on a runner of its own. A shard builds the pinned
  # binaries its tests run (build-pinned) and runs its groups, two at once. Linux runs four shards
  # and macOS three. The hosted macOS runners are shared by the organization's repositories, five
  # at once: on pull request #297's run two of its four macOS shards waited 4.7 and 6.6 minutes for
  # one while other repositories' macOS jobs held the rest. Three keep this run's macOS jobs at
  # three at once, and macOS, whose groups took 1850 s in all against Linux's 2501 s, still ends
  # its longest shard within the longest group's time. A table of its own for macOS is the change
  # the script's refusal rules allow: JPACK_UNIT_SHARD=i/n selects the table of n rows, and every
  # run checks every table. On a pull request or a merge group a shard runs its groups only when
  # the changed paths map to unit-tests, the same selection as the Runner job's, and otherwise ends
  # with nothing run.
  unit:
    name: Unit tests (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.of }})
    runs-on: ${{ matrix.os }}
    # Each shard keeps the step's 50-minute bound; allow job setup and evidence headroom.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, shard: 1, of: 4}
          - {os: ubuntu-latest, shard: 2, of: 4}
          - {os: ubuntu-latest, shard: 3, of: 4}
          - {os: ubuntu-latest, shard: 4, of: 4}
          - {os: macos-latest, shard: 1, of: 3}
          - {os: macos-latest, shard: 2, of: 3}
          - {os: macos-latest, shard: 3, of: 3}
    steps:
      # The whole history, so that --changed finds the merge base with the base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      # The other steps of dev.json are skipped: the Runner job runs them.
      - name: Unit tests, shard ${{ matrix.shard }} of ${{ matrix.of }}
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          JPACK_UNIT_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: |
          set -o pipefail
          if [ "$EVENT" = pull_request ]; then
            scripts/dev/check.sh --all --changed "origin/$BASE_REF" --skip local-paths,agent-docs,diff-check,go-fmt,go-vet,manual-gate,chain-tests,openapi,build,ci-evidence,release-toolchain,third-party-notices,release-archives,release-programs,postgresql-store | tee "${{ runner.temp }}/checks.log"
          elif [ "$EVENT" = merge_group ]; then
            scripts/dev/check.sh --all --changed "$GROUP_BASE" --skip local-paths,agent-docs,diff-check,go-fmt,go-vet,manual-gate,chain-tests,openapi,build,ci-evidence,release-toolchain,third-party-notices,release-archives,release-programs,postgresql-store | tee "${{ runner.temp }}/checks.log"
          else
            scripts/dev/check.sh --all --only build-pinned,unit-tests | tee "${{ runner.temp }}/checks.log"
          fi
      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python3 scripts/dev/release_evidence.py capture --workflow ci --job unit-${{ matrix.os }}-${{ matrix.shard }} --check-log "${{ runner.temp }}/checks.log" --output "${{ runner.temp }}/evidence.json"
      - name: Upload immutable CI evidence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-ci-unit-${{ matrix.os }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7

  check:
    name: Runner (${{ matrix.os }})
    # After every shard, whatever its result, so that a failed or cancelled shard fails this job
    # (the name branch protection requires) instead of skipping it, which would count as passing.
    needs: unit
    if: ${{ always() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Every unit-test shard succeeded
        env:
          UNIT: ${{ needs.unit.result }}
        run: |
          if [ "$UNIT" != success ]; then
            echo "the Unit tests jobs ended $UNIT, not success: this job fails with them"
            exit 1
          fi
      # The whole history, so that --changed finds the merge base with the base branch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # First, so that a manifest that does not parse fails before the long steps start.
      - name: The manifest parses and its first step runs
        run: scripts/dev/check.sh --manifest dev.json --only local-paths
      # The exact toolchain release.yml links the archives with, so that the integration tests a
      # release takes as its proof ran under it (.github/ci-evidence.json pins it).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      # The pinned Runtimes, the ownership-era Runner and the Gateway are checked out and built by
      # the build-pinned step (scripts/checks/build-pinned.sh).
      # A pull request runs the steps jpdev.json maps its changed paths to, and the whole list when
      # a path is unmapped or the mapping, dev.json or the runner changed; a merge group runs the
      # steps its changes since the group's base map to, the same way. A push to main runs the
      # whole list, and only that run is what a release is held to. The release steps are skipped
      # here either way: `Release contents` runs them; so is unit-tests: the `Unit tests` jobs run
      # it. The summary is kept for the evidence.
      - name: Checks
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -o pipefail
          if [ "$EVENT" = pull_request ]; then
            scripts/dev/check.sh --all --changed "origin/$BASE_REF" --skip release-toolchain,third-party-notices,release-archives,release-programs,postgresql-store,unit-tests | tee "${{ runner.temp }}/checks.log"
          elif [ "$EVENT" = merge_group ]; then
            scripts/dev/check.sh --all --changed "$GROUP_BASE" --skip release-toolchain,third-party-notices,release-archives,release-programs,postgresql-store,unit-tests | tee "${{ runner.temp }}/checks.log"
          else
            scripts/dev/check.sh --all --skip release-toolchain,third-party-notices,release-archives,release-programs,postgresql-store,unit-tests | tee "${{ runner.temp }}/checks.log"
          fi
      # The commit, its input identities, this runner's image and tools, and every check's result:
      # the evidence the release takes (.github/ci-evidence.json). Only a push to main records it.
      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python3 scripts/dev/release_evidence.py capture --workflow ci --job runner-${{ matrix.os }} --check-log "${{ runner.temp }}/checks.log" --output "${{ runner.temp }}/evidence.json"
      - name: Upload immutable CI evidence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-ci-runner-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7

  # What a repository release carries (docs/releasing.md), checked on every
  # commit so a tag is never the first to find a gap. The toolchain is the exact
  # one release.yml names: the notices include the toolchain's own licence.
  release-contents:
    name: Release contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - name: The release steps of dev.json
        run: |
          set -o pipefail
          scripts/dev/check.sh --all --only release-toolchain,third-party-notices,release-archives,release-programs | tee "${{ runner.temp }}/checks.log"
      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python3 scripts/dev/release_evidence.py capture --workflow ci --job release-contents --check-log "${{ runner.temp }}/checks.log" --output "${{ runner.temp }}/evidence.json"
      - name: Upload immutable CI evidence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-ci-release-contents-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7

  # The postgresql store kind's tests (docs/design/store-postgresql.md, section 10), against a
  # PostgreSQL 16 service container, in a job of its own so that no other job waits for the
  # server. The container's superuser makes an administrator that is not one, with the two
  # attributes the tests' roles and databases need, and is not used again; a test that would
  # skip fails here (JPACK_TEST_POSTGRESQL_REQUIRED).
  postgresql-store:
    name: PostgreSQL store
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-superuser-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
      - name: An administrator that is not a superuser
        env:
          PGPASSWORD: ci-superuser-only
        run: >-
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1
          -c "CREATE ROLE jpack_ci_admin LOGIN CREATEROLE CREATEDB PASSWORD 'ci-admin-only'"
          -c "GRANT pg_write_all_data TO jpack_ci_admin WITH ADMIN TRUE, INHERIT FALSE, SET FALSE"
      - name: The postgresql store's step of dev.json
        env:
          JPACK_TEST_POSTGRESQL: postgres://jpack_ci_admin:ci-admin-only@127.0.0.1:5432/postgres?sslmode=disable
          JPACK_TEST_POSTGRESQL_REQUIRED: '1'
        run: |
          set -o pipefail
          scripts/dev/check.sh --all --only postgresql-store | tee "${{ runner.temp }}/checks.log"
      - name: Record exact CI inputs and coverage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: python3 scripts/dev/release_evidence.py capture --workflow ci --job postgresql-store --check-log "${{ runner.temp }}/checks.log" --output "${{ runner.temp }}/evidence.json"
      - name: Upload immutable CI evidence
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-evidence-ci-postgresql-store-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence.json
          if-no-files-found: error
          retention-days: 7

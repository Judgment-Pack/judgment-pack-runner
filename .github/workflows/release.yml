name: Release

# Publishes a release of this repository: four archives (Linux and macOS,
# amd64 and arm64), their checksums and a build-provenance attestation, from
# a tag a person pushes on a commit already on main (docs/releasing.md).
# "Release" here is a repository release. It is not a frozen pack release,
# which is Runner's own record and is unaffected.
#
# A person decides there is a release and writes its notes
# (docs/releases/<tag>.md). The workflow holds the tagged commit to CI, builds
# from it, runs three of the four archives on their own platforms, and
# publishes no release until a maintainer approves the `production`
# environment.
#
# Not secret before that approval: the archives (an artifact of the run), their
# attestation (recorded in a public log when made), and the draft (visible to
# those who can write to the repository).
#
# Every job works on the commit the run was started for, by digest. A tag is a
# name and can be moved until its release is published, so the tag is compared
# with that commit when the run begins, before the draft, and before publishing.

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  admit:
    name: Admit the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Reading an environment's protection rules.
      actions: read
    steps:
      # SemVer 2.0.0 for the numbers and the prerelease. Build metadata (+...)
      # is refused: it would give one version two names.
      - name: Validate release tag syntax
        shell: bash
        run: |
          number='(0|[1-9][0-9]*)'
          identifier='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          version="^v${number}\.${number}\.${number}(-${identifier}(\.${identifier})*)?$"
          if [[ ! "${RELEASE_TAG}" =~ ${version} ]]; then
            echo "Release tag is not vX.Y.Z or vX.Y.Z-prerelease (no build metadata): ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Check out the commit the run was started for
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require the tag to name that commit
        shell: bash
        run: |
          # ls-remote patterns match the end of a name, so lines are selected
          # by exact name. The peeled line is the commit an annotated tag
          # points to; a lightweight tag has only its own line.
          named="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            | awk -v tag="refs/tags/${RELEASE_TAG}" '$2 == tag { plain = $1 } $2 == tag "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : plain) }')"
          [ -n "${named}" ] && [ "${named}" = "${GITHUB_SHA}" ] || { echo "refs/tags/${RELEASE_TAG} names ${named:-nothing}; the run was started for ${GITHUB_SHA}" >&2; exit 1; }

      # Only merged work is released: a tag on a branch commit names a state
      # main may never hold. Any commit on main is admitted, not only its tip.
      # Main is named in full: a tag called origin/main would answer the short
      # name before the branch.
      - name: Require the tagged commit on main
        shell: bash
        run: |
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main || { echo "Tagged commit ${GITHUB_SHA} is not on main" >&2; exit 1; }

      - name: Require release notes
        shell: bash
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          test -s "${notes}" || { echo "${notes} is missing or empty at the tag" >&2; exit 1; }

      # GitHub creates a missing environment on first use, without protection.
      # Read the rule before building so the publish gate cannot be a bare name.
      - name: Require a reviewer on the production environment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          reviewers="$(gh api "repos/${GH_REPO}/environments/production" --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')" \
            || { echo "The production environment could not be read; create it with a required reviewer (docs/releasing.md)" >&2; exit 1; }
          [ "${reviewers}" -ge 1 ] || { echo "The production environment requires no reviewer" >&2; exit 1; }

  # The tagged commit's own ci.yml, called, so release.yml carries no second
  # copy of the checks or of the Runtime and Gateway pins. A check main has
  # gained since that commit is not run.
  verify:
    name: CI at the tag
    needs: admit
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  package:
    name: Package
    needs:
      - admit
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the commit the run was started for
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # One reviewed toolchain for release binaries, named exactly. The go
          # directive in go.mod remains the source-compatibility floor.
          go-version: 1.26.5
          cache-dependency-path: go.sum

      # Checked by CI already; again here on the commit being packaged, with
      # the toolchain that links it, whose own licence is part of the notices.
      - name: Check third-party notices against linked modules
        run: python3 tools/third_party_notices.py --check

      - name: Normalize archive file timestamps
        shell: bash
        run: |
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          touch --date="@${source_date_epoch}" LICENSE README.md THIRD_PARTY_NOTICES openapi.json

      - name: Package without publishing
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --skip=publish
        env:
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}

      # Printed so the run's own record says what it packaged. The publish job
      # compares the draft with these again before it publishes.
      - name: Verify packaged checksums
        working-directory: dist
        run: |
          sha256sum --check checksums.txt
          cat checksums.txt

      # Checked on the archives themselves, all four, not on the configuration
      # meant to produce them (tools/release_archives.py): an archive holds
      # files and nothing else, each in the form the packer writes, under its
      # plain name and once; the documents are the commit's byte for byte;
      # each program is one program
      # built from the package of its name, for the archive's platform, at the
      # lowest level of its architecture, readable and executable by everyone.
      # CI runs the script against sound archives and against archives spoiled
      # one way at a time.
      - name: Check the contents of every archive
        shell: bash
        run: python3 tools/release_archives.py --dist dist --version "${RELEASE_TAG#v}" --commit "${GITHUB_SHA}"

      - name: Carry the release notes with the archives
        shell: bash
        run: cp "docs/releases/${RELEASE_TAG}.md" dist/release-notes.md

      - name: Upload release archives for native smoke tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/release-notes.md
          if-no-files-found: error
          # As long as an approval may be waited for: the publish job reads
          # the artifact again after the gate.
          retention-days: 30

  smoke:
    name: ${{ matrix.os }} release archive
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          # linux/arm64 runs natively before the gate; a macOS arm runner
          # executes the darwin binary, not this one.
          - ubuntu-24.04-arm
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Download packaged archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      # Starting a job needs Runtime and a boot line from Desk; CI covers that
      # at the tag. Here each archive is shown to hold programs that run on
      # their platform, name the release, and refuse to start unconfigured.
      - name: Verify and smoke-test native archive
        shell: bash
        run: |
          case "$(uname -s)" in
            Darwin) release_os="darwin"; checksum_command=(shasum -a 256 --check) ;;
            Linux) release_os="linux"; checksum_command=(sha256sum --check) ;;
            *) echo "Unsupported runner OS: $(uname -s)" >&2; exit 1 ;;
          esac

          case "$(uname -m)" in
            arm64|aarch64) release_arch="arm64" ;;
            x86_64) release_arch="amd64" ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          release_version="${RELEASE_TAG#v}"
          archive="judgment-pack-runner_${release_version}_${release_os}_${release_arch}.tar.gz"
          destination="${RUNNER_TEMP}/runner-release-smoke"

          (cd dist && "${checksum_command[@]}" checksums.txt)
          mkdir -p "${destination}"
          tar -xzf "dist/${archive}" -C "${destination}"

          for program in jpack-runner jpack-source-worker jpack-google-relay; do
            test -x "${destination}/${program}" || { echo "${program} is not in the archive, or not executable" >&2; exit 1; }
          done
          # Assigned first, compared after: a program that prints the right
          # words and exits non-zero fails the step.
          for program in jpack-runner jpack-source-worker; do
            reported="$("${destination}/${program}" version)"
            [ "${reported}" = "${program} ${RELEASE_TAG}" ] || { echo "${program} reports ${reported}" >&2; exit 1; }
          done

          # No boot line: the refusal, exit 1, is the expected answer.
          output="$("${destination}/jpack-runner" 2>&1 < /dev/null)" && code=0 || code=$?
          if [ "${code}" != "1" ] || [ "${output}" != "runner: bounded boot configuration required" ]; then
            echo "jpack-runner did not refuse an empty boot: exit ${code}: ${output}" >&2
            exit 1
          fi

  attest-and-draft:
    name: Attest and draft release
    needs:
      - package
      - smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download smoke-tested archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Require the tag to still name that commit
        shell: bash
        run: |
          named="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            | awk -v tag="refs/tags/${RELEASE_TAG}" '$2 == tag { plain = $1 } $2 == tag "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : plain) }')"
          [ -n "${named}" ] && [ "${named}" = "${GITHUB_SHA}" ] || { echo "refs/tags/${RELEASE_TAG} names ${named:-nothing}; the archives were built from ${GITHUB_SHA}" >&2; exit 1; }

      # An existing release, draft or published, is never replaced or completed
      # from here. A person inspects what a failed run left (docs/releasing.md).
      - name: Require that no release exists under this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # List every release, drafts included, and match the tag exactly. A
          # failed lookup fails the step; it is never read as absence.
          state="$(gh api "repos/${GH_REPO}/releases" --paginate --jq '.[] | select(.tag_name == env.RELEASE_TAG) | if .draft then "a draft" else "published" end')"
          if [ -n "${state}" ]; then
            echo "A release under ${RELEASE_TAG} already exists, and it is $(echo "${state}" | sort -u | paste -sd, -)" >&2
            exit 1
          fi

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh cannot infer the repository.
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(dist/*.tar.gz dist/checksums.txt)
          if (( ${#assets[@]} != 5 )); then
            echo "Expected four archives and checksums.txt, found ${#assets[@]} files" >&2
            exit 1
          fi

          release_args=(
            "${RELEASE_TAG}"
            "${assets[@]}"
            --draft
            --notes-file dist/release-notes.md
            --title "runner ${RELEASE_TAG}"
            --verify-tag
          )
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${release_args[@]}"

  publish:
    name: Publish release
    needs: attest-and-draft
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Require the tag to still name that commit
        shell: bash
        run: |
          named="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" \
            | awk -v tag="refs/tags/${RELEASE_TAG}" '$2 == tag { plain = $1 } $2 == tag "^{}" { peeled = $1 } END { print (peeled != "" ? peeled : plain) }')"
          [ -n "${named}" ] && [ "${named}" = "${GITHUB_SHA}" ] || { echo "refs/tags/${RELEASE_TAG} names ${named:-nothing}; the draft was built from ${GITHUB_SHA}" >&2; exit 1; }

      - name: Download the archives this run packaged
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: run

      # A draft can be changed while it waits at the gate, by anyone who can
      # write to the repository. Download it as it now stands and compare it
      # with what this run packaged: the title the workflow gave it, the notes
      # the commit holds, the same files by name, the same list of checksums,
      # and every archive the bytes that list names. A moment remains between
      # this check and publishing; nothing here closes it.
      - name: Require the draft to hold what this run packaged
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state="$(gh release view "${RELEASE_TAG}" --json isDraft --jq .isDraft)"
          [ "${state}" = "true" ] || { echo "The release under ${RELEASE_TAG} is not a draft" >&2; exit 1; }

          drafted_title="$(gh release view "${RELEASE_TAG}" --json name --jq .name)"
          [ "${drafted_title}" = "runner ${RELEASE_TAG}" ] || { echo "The draft is titled ${drafted_title}; the workflow titled it runner ${RELEASE_TAG}" >&2; exit 1; }
          # Both are taken without the newlines they end in, which the two
          # ways of reading them do not agree on.
          drafted_notes="$(gh release view "${RELEASE_TAG}" --json body --jq .body)"
          packaged_notes="$(cat run/release-notes.md)"
          [ "${drafted_notes}" = "${packaged_notes}" ] || { echo "The draft's notes are not the notes the commit holds:" >&2; diff <(echo "${packaged_notes}") <(echo "${drafted_notes}") >&2; exit 1; }

          mkdir draft
          gh release download "${RELEASE_TAG}" --dir draft

          packaged="$(cd run && find . -type f ! -name release-notes.md | LC_ALL=C sort)"
          drafted="$(cd draft && find . -type f | LC_ALL=C sort)"
          [ "${packaged}" = "${drafted}" ] || { echo "The draft does not hold the files this run packaged:" >&2; diff <(echo "${packaged}") <(echo "${drafted}") >&2; exit 1; }

          cmp run/checksums.txt draft/checksums.txt
          # The list is read in the one form this workflow writes it: a digest,
          # two spaces, and a name of plain characters. Any other line is
          # refused, though a checksum program would read it.
          if grep -q -v -E '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' draft/checksums.txt; then
            echo "checksums.txt holds a line that is not a digest, two spaces and a plain name" >&2
            exit 1
          fi
          named="$(awk '{ print "./" $2 }' draft/checksums.txt | LC_ALL=C sort)"
          archives="$(cd draft && find . -type f ! -name checksums.txt | LC_ALL=C sort)"
          [ "${named}" = "${archives}" ] || { echo "checksums.txt does not name the draft's archives, each once:" >&2; diff <(echo "${named}") <(echo "${archives}") >&2; exit 1; }
          (cd draft && sha256sum --check --strict checksums.txt)

      - name: Publish the reviewed draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          publish_args=("${RELEASE_TAG}" --draft=false)
          # A prerelease (tag contains a hyphen) is never marked latest.
          if [[ "${RELEASE_TAG}" != *-* ]]; then
            publish_args+=(--latest)
          fi
          gh release edit "${publish_args[@]}"

# yaml-language-server: $schema=https://raw.githubusercontent.com/goreleaser/goreleaser/v2.17.0/www/docs/static/schema.json
version: 2

project_name: judgment-pack-runner

# Linux and macOS only: those are the hosts CI tests. Windows compiles and is
# not released, because nothing runs it. CI compares the names below with the
# directories under cmd as an early warning; the release workflow checks the
# archives themselves.
builds:
  - &program
    id: jpack-runner
    main: ./cmd/jpack-runner
    binary: jpack-runner
    env:
      - CGO_ENABLED=0
      - GOWORK=off
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/Judgment-Pack/judgment-pack-runner/internal/buildinfo.releaseVersion={{ if .IsSnapshot }}v{{ .Version }}{{ else }}{{ .Tag }}{{ end }}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    # The lowest level of each architecture, stated rather than defaulted: an
    # archive named for an architecture runs on every processor of it.
    goamd64:
      - v1
    goarm64:
      - v8.0
    mod_timestamp: "{{ .CommitTimestamp }}"
  - <<: *program
    id: jpack-source-worker
    main: ./cmd/jpack-source-worker
    binary: jpack-source-worker
  - <<: *program
    id: jpack-google-relay
    main: ./cmd/jpack-google-relay
    binary: jpack-google-relay

archives:
  - id: judgment-pack-runner-archives
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES
      - openapi.json

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Release notes are written by a person and reviewed with the release
# (docs/releases/<tag>.md); none are generated.
changelog:
  disable: true

release:
  draft: true
  prerelease: auto
  name_template: "runner {{ .Tag }}"
